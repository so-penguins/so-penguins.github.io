<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DSCI550 - Creating Data Insights from the Haunted Places Dataset</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <!-- Home View -->
  <section class="home-view" id="homeView">
    <div class="container">
      <h1 class="title is-2 has-text-centered has-text-white mb-6">
        Creating Data Insights from the Haunted Places Dataset
      </h1>
      <h2 class="subtitle is-4 has-text-centered has-text-white mb-6">
        By DSCI 550 Team 6
      </h2>

      <!-- Carousel -->
      <div class="carousel-wrapper">
        <div class="swiper">
          <div class="swiper-wrapper">
            <!-- Slides -->
            <div class="swiper-slide">
              <img src="./assets/01.jpg" alt="Haunted Place 1">
            </div>
            <div class="swiper-slide">
              <img src="./assets/02.jpg" alt="Haunted Place 2">
            </div>
            <div class="swiper-slide">
              <img src="./assets/03.jpg" alt="Haunted Place 3">
            </div>
            <div class="swiper-slide">
              <img src="./assets/04.jpg" alt="Haunted Place 4">
            </div>
            <div class="swiper-slide">
              <img src="./assets/05.jpg" alt="Haunted Place 5">
            </div>
            <div class="swiper-slide">
              <img src="./assets/06.jpg" alt="Haunted Place 6">
            </div>
            <div class="swiper-slide">
              <img src="./assets/07.jpg" alt="Haunted Place 7">
            </div>
            <div class="swiper-slide">
              <img src="./assets/08.jpg" alt="Haunted Place 8">
            </div>
            <div class="swiper-slide">
              <img src="./assets/09.jpg" alt="Haunted Place 9">
            </div>
            <div class="swiper-slide">
              <img src="./assets/10.jpg" alt="Haunted Place 10">
            </div>
            <div class="swiper-slide">
              <img src="./assets/11.jpg" alt="Haunted Place 11">
            </div>
            <div class="swiper-slide">
              <img src="./assets/12.jpg" alt="Haunted Place 12">
            </div>
            <div class="swiper-slide">
              <img src="./assets/13.jpg" alt="Haunted Place 13">
            </div>
            <div class="swiper-slide">
              <img src="./assets/14.jpg" alt="Haunted Place 14">
            </div>
            <div class="swiper-slide">
              <img src="./assets/15.jpg" alt="Haunted Place 15">
            </div>
            <div class="swiper-slide">
              <img src="./assets/16.jpg" alt="Haunted Place 16">
            </div>
            <div class="swiper-slide">
              <img src="./assets/17.jpg" alt="Haunted Place 17">
            </div>
            <div class="swiper-slide">
              <img src="./assets/18.jpg" alt="Haunted Place 18">
            </div>
            <div class="swiper-slide">
              <img src="./assets/19.jpg" alt="Haunted Place 19">
            </div>
            <div class="swiper-slide">
              <img src="./assets/20.jpg" alt="Haunted Place 20">
            </div>
          </div>
          <!-- Navigation -->
          <div class="swiper-button-next"></div>
          <div class="swiper-button-prev"></div>
        </div>
        <div id="slide-description" class="carousel-description">
          <!-- Description will be updated via JavaScript -->
        </div>
      </div>

      <div class="has-text-centered mt-6">
        <button class="button is-primary is-large" onclick="showVisualizations()">
          Explore Visualizations
        </button>
      </div>
    </div>
  </section>

  <!-- Visualizations View -->
  <section class="visualization-view" id="visualizationView">
    <div class="main-container">
      <div class="button-container">
        <div class="button-row">
          <button class="button is-outlined" onclick="showHome()">
            <span class="icon is-small">
              <i class="fas fa-arrow-left"></i>
            </span>
          </button>
          <button class="viz-button button is-info" data-viz="force-graph">Named Entity Force-Directed Graph</button>
          <button class="viz-button button is-info" data-viz="circle-packing-morandi">Circle Packing</button>
          <button class="viz-button button is-info" data-viz="radial-tree-collapsible">Radial Dendrogram</button>
          <button class="viz-button button is-info" data-viz="force-graph-v2">Force Graph V2</button>
          <button class="viz-button button is-info" data-viz="timeseries">Time Series</button>
        </div>
        <div class="viz-info-container">
          <div id="viz-title" class="viz-title" style="font-size:1.3rem;font-weight:600;color:#fff;margin-bottom:0.3rem;"></div>
          <div id="viz-description" class="viz-description">
            <!-- Description will be updated via JavaScript -->
          </div>
        </div>
      </div>
      <div id="visualization" class="visualization-container"></div>
      <div id="tooltip" class="tooltip" style="opacity:0;"></div>
    </div>
  </section>

  <!-- D3 and Swiper CDN -->
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

  <script src="script.js"></script>
</body>

</html>
